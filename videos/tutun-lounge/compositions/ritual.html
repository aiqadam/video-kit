    <script>
      window.__timelines["ritual"] = kit.scene("ritual", function (t, s) {
        var BAR = 2.7907, BEAT = BAR / 4;

        // one shot a bar, hard cuts on the downbeat; each lands with a small punch-in and drifts
        for (var i = 0; i < 6; i++) {
          var a = i * BAR, b = a + BAR;
          var on = t >= a && t < b;
          kit.set(s.$("#ritual-s" + (i + 1)), {
            visibility: on ? "visible" : "hidden",
            scale: kit.interp(t, [a, a + 0.3, b], [1.1, 1.03, 1.0], [kit.ease.out, kit.ease.linear]),
          });
          var cap = s.$("#ritual-c" + (i + 1));
          kit.set(cap, { visibility: on ? "visible" : "hidden" });
          var word = cap.querySelector(".ritual-word"), num = cap.querySelector(".ritual-num"), sub = cap.querySelector(".ritual-sub");
          kit.words(word, t, a + 0.08, { step: 0.08, len: 0.35 });
          if (num) kit.reveal(num, t, a, { y: 10, len: 0.3 });
          if (sub) kit.reveal(sub, t, a + 0.35, { y: 14, len: 0.4 });
        }

        // the three panels come in on beats one, two and three of the last bar
        ["#ritual-p1", "#ritual-p2", "#ritual-p3"].forEach(function (id, k) {
          var at = 5 * BAR + k * BEAT;
          var p = kit.prog(t, at, at + 0.25);
          kit.set(s.$(id), { opacity: t >= at ? 1 : 0, y: (1 - p) * 60 });
        });
      });
    </script>
