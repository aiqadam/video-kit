<template>
  <div id="root" data-composition-id="brand">
    <style>
      #root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font), sans-serif;
      }
      #brand-wipe {
        position: absolute;
        inset: 0;
        background: var(--night);
        transform-origin: 50% 0;
      }
      #brand-lock {
        position: absolute;
        left: 0;
        right: 0;
        top: 520px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #brand-hanger {
        width: 360px;
        height: 216px;
        overflow: visible;
      }
      #brand-word {
        margin-top: 4px;
        font-family: var(--display), serif;
        font-style: italic;
        font-weight: 600;
        font-size: 260px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      #brand-dot {
        color: var(--accent);
      }
      #brand-tag {
        margin-top: 46px;
        font-size: 50px;
        font-weight: 500;
        color: var(--muted);
      }
      #brand-tag .accent {
        color: var(--accent);
        font-weight: 700;
      }
      #root .sub {
        position: absolute;
        left: 60px;
        right: 60px;
        bottom: 300px;
        text-align: center;
        z-index: 60;
      }
      #root .sub span {
        display: inline-block;
        padding: 12px 26px;
        border-radius: 16px;
        background: rgba(20, 18, 15, 0.8);
        color: #fff;
        font-size: 36px;
        font-weight: 500;
        line-height: 1.3;
      }
    </style>
    <div id="brand-lock">
      <svg id="brand-hanger" viewBox="0 0 200 120">
        <path id="brand-hook" pathLength="1" d="M100 40 V31 C100 24 113 21 113 12 C113 5 107 1 100 1 C93 1 88 5 88 11" fill="none" stroke="#C8553D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="brand-body" pathLength="1" d="M100 40 L13 94 C4 100 8 112 18 112 H182 C192 112 196 100 187 94 Z" fill="none" stroke="#1B1A17" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div id="brand-word">наряд<span id="brand-dot">.</span></div>
      <div id="brand-tag">Что надеть на работу — <span class="accent">решено</span></div>
    </div>
    <div class="sub" id="brand-sub"><span></span></div>
    <script>
      window.__timelines["brand"] = kit.scene("brand", function (t, s) {
        // the dark morning lifts off like a blind
        kit.set(s.$("#brand-wipe"), { transform: "scaleY(" + (1 - kit.prog(t, 0, 0.45, kit.ease.inOut)) + ")" });
        var hook = kit.prog(t, 0.15, 0.55), body = kit.prog(t, 0.35, 1.0);
        s.$("#brand-hook").style.strokeDasharray = "1 1";
        s.$("#brand-hook").style.strokeDashoffset = String(1 - hook);
        s.$("#brand-body").style.strokeDasharray = "1 1";
        s.$("#brand-body").style.strokeDashoffset = String(1 - body);
        kit.set(s.$("#brand-hanger"), { rotate: 6 * Math.sin(t * 3.2) * (1 - kit.prog(t, 0.6, 2.4)) });
        kit.reveal(s.$("#brand-word"), t, 0.55, { y: 50, len: 0.6 });
        kit.pop(s.$("#brand-dot"), t, 1.0, { base: 0.2 });
        kit.reveal(s.$("#brand-tag"), t, 1.2);
        brandSub(s.$("#brand-sub"), t, s, ["02"]);
      });

      function brandSub(el, t, s, ids) {
        var on = null;
        ids.forEach(function (id) {
          var l = s.line(id);
          if (t >= l.start - 0.15 && t < l.end + 0.4) on = id;
        });
        var span = el.firstElementChild;
        if (!on) return kit.set(el, { opacity: 0 });
        if (span.__id !== on) {
          span.textContent = kit.t("sub." + on);
          span.__id = on;
        }
        var l = s.line(on);
        kit.set(el, { opacity: Math.min(kit.prog(t, l.start - 0.15, l.start + 0.1), 1 - kit.prog(t, l.end + 0.15, l.end + 0.4)) });
      }
    </script>
    <div id="brand-wipe"></div>
  </div>
</template>
