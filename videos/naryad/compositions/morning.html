    <script>
      function morningCam(el, t, keys) {
        var ts = keys.map(function (k) { return k.t; });
        var e = kit.ease.camera;
        kit.set(el, {
          scale: kit.interp(t, ts, keys.map(function (k) { return k.s; }), e),
          x: kit.interp(t, ts, keys.map(function (k) { return k.x || 0; }), e),
          y: kit.interp(t, ts, keys.map(function (k) { return k.y || 0; }), e),
        });
      }

      window.__timelines["morning"] = kit.scene("morning", function (t, s) {
        kit.reveal(s.$("#morning-kicker"), t, 0.05);
        kit.words(s.$("#morning-title"), t, 0.15, { step: 0.09, accent: ["погоду", "день"] });
        kit.set(s.$("#morning-phone"), { y: (1 - kit.prog(t, 0, 0.7)) * 160, opacity: kit.prog(t, 0, 0.3) });
        morningCam(s.$("#morning-cam"), t, [
          { t: 0, s: 1.42 }, { t: 1.9, s: 1.42 }, { t: 2.6, s: 1.95, y: 330 }, { t: 4.6, s: 1.95, y: 330 },
          { t: 5.3, s: 1.42 }, { t: 9.6, s: 1.47 },
        ]);

        // lock screen with the notification, then the app pushes in
        var push = kit.prog(t, 1.75, 2.2, kit.ease.out);
        kit.set(s.$("#morning-lock"), { x: -110 * push, display: t < 2.25 ? "block" : "none" });
        kit.set(s.$("#morning-today"), { x: 393 * (1 - push), display: t >= 1.75 ? "block" : "none" });
        s.$("#morning-status").style.color = push > 0.5 ? "#1b1a17" : "#ffffff";
        var note = kit.prog(t, 0.45, 0.85);
        kit.set(s.$("#morning-note"), { y: -60 * (1 - note), opacity: note, scale: 1 });

        // the day's context arrives, then the outfit
        kit.reveal(s.$("#morning-weather"), t, 2.6, { y: 16 });
        kit.reveal(s.$("#morning-cal"), t, 3.2, { y: 16 });
        kit.reveal(s.$("#morning-rain"), t, 4.2, { y: 10 });
        var lk = kit.prog(t, 2.3, 2.8);
        kit.set(s.$("#morning-hint"), { opacity: kit.prog(t, 5.6, 6.0) * (1 - kit.prog(t, 6.8, 7.0)) });

        // swipe the first outfit away (6.8–7.3), the second takes its place
        var sw = kit.prog(t, 6.8, 7.3, kit.ease.in);
        kit.set(s.$("#morning-look1"), { x: -520 * sw, y: 30 * sw + (1 - lk) * 40, rotate: -14 * sw, opacity: lk * (1 - kit.prog(t, 7.1, 7.3)) });
        var up = kit.prog(t, 7.0, 7.5);
        kit.set(s.$("#morning-look2"), { scale: 0.93 + 0.07 * up, y: 14 * (1 - up), opacity: t < 6.7 ? 0 : 1 });

        var c = kit.cursor(s.$("#morning-cursor"), t, [
          { t: 0.9, x: 300, y: 520 }, { t: 1.5, x: 200, y: 370, tap: true }, { t: 2.0, x: 240, y: 560 },
          { t: 6.2, x: 250, y: 560 }, { t: 6.75, x: 290, y: 470 }, { t: 7.25, x: 60, y: 450 },
          { t: 7.9, x: 190, y: 700 }, { t: 8.5, x: 196, y: 792, tap: true }, { t: 9.6, x: 230, y: 700 },
        ], { from: 0.9 });
        var done = t >= 8.5;
        kit.set(s.$("#morning-go"), { scale: t > 8.3 && t < 8.9 ? 1 - 0.06 * c : 1, background: done ? "#1b1a17" : "#c8553d" });
        s.$("#morning-go-t").textContent = done ? "Выбрано ✓" : "Надеваю";
        morningSub(s.$("#morning-sub"), t, s, ["03", "04"]);
      });

      function morningSub(el, t, s, ids) {
        var on = null;
        ids.forEach(function (id) {
          var l = s.line(id);
          if (t >= l.start - 0.15 && t < l.end + 0.4) on = id;
        });
        var span = el.firstElementChild;
        if (!on) return kit.set(el, { opacity: 0 });
        if (span.__id !== on) {
          span.textContent = kit.t("sub." + on);
          span.__id = on;
        }
        var l = s.line(on);
        kit.set(el, { opacity: Math.min(kit.prog(t, l.start - 0.15, l.start + 0.1), 1 - kit.prog(t, l.end + 0.15, l.end + 0.4)) });
      }
