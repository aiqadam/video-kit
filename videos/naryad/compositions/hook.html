    <script>
      window.__timelines["hook"] = kit.scene("hook", function (t, s) {
        var B = 2.5;
        kit.set(s.$("#hook-card"), { y: (1 - kit.prog(t, -0.2, 0.6)) * 60 });
        // shot 1: the alarm; visible from the first frame (the thumbnail)
        kit.beat(s.$("#hook-a"), t, -1, B);
        kit.set(s.$("#hook-a-cam"), { scale: 1.04 + 0.05 * (t / B) });
        kit.set(s.$("#hook-cap-a"), { opacity: 1 - kit.prog(t, B - 0.25, B, kit.ease.linear) });
        kit.set(s.$("#hook-a-kicker"), { opacity: 1 });
        var mm = t < 1.5 ? "07:39" : "07:40";
        s.$("#hook-time").textContent = mm;
        kit.set(s.$("#hook-time"), { scale: t >= 1.5 ? 1 + 0.06 * (1 - kit.prog(t, 1.5, 1.9)) : 1 });
        // shot 2: hands going through the hangers
        kit.beat(s.$("#hook-b"), t, B, s.dur + 1, { enter: 1.12, last: true });
        kit.set(s.$("#hook-b-cam"), { scale: 1.06 + 0.04 * ((t - B) / 3.3) });
        kit.set(s.$("#hook-cap-b"), { opacity: t >= B ? 1 : 0 });
        kit.reveal(s.$("#hook-b-kicker"), t, B + 0.05);
        kit.words(s.$("#hook-title"), t, B + 0.15, { step: 0.12, accent: ["Надеть", "нечего"] });
        hookSub(s.$("#hook-sub"), t, s, ["01"]);
      });

      function hookSub(el, t, s, ids) {
        var on = null;
        ids.forEach(function (id) {
          var l = s.line(id);
          if (t >= l.start - 0.15 && t < l.end + 0.4) on = id;
        });
        var span = el.firstElementChild;
        if (!on) return kit.set(el, { opacity: 0 });
        if (span.__id !== on) {
          span.textContent = kit.t("sub." + on);
          span.__id = on;
        }
        var l = s.line(on);
        kit.set(el, { opacity: Math.min(kit.prog(t, l.start - 0.15, l.start + 0.1), 1 - kit.prog(t, l.end + 0.15, l.end + 0.4)) });
      }
