        s.$("#brand-word").querySelectorAll("span").forEach(function (el, i) {
          var p = kit.prog(t, 0.25 + i * 0.05, 0.75 + i * 0.05, kit.ease.outBack);
          kit.set(el, { y: (1 - p) * 120, opacity: Math.min(1, p * 1.5) });

        kit.words(s.$("#brand-tag"), t, 1.0, { step: 0.07, accent: ["jadval"] });

        kit.set(s.$("#brand-lock"), { scale: 1 + 0.6 * kit.prog(t, s.dur - 0.35, s.dur, kit.ease.in) });

      function brandSub(el, t, s, ids) {
        var on = null;
        ids.forEach(function (id) {
          var l = s.line(id);
          if (t >= l.start - 0.15 && t < l.end + 0.4) on = id;
        });
        var span = el.firstElementChild;
        if (!on) return kit.set(el, { opacity: 0 });
        if (span.__id !== on) {
          span.textContent = kit.t("sub." + on);
          span.__id = on;
        }
        var l = s.line(on);
        kit.set(el, { opacity: Math.min(kit.prog(t, l.start - 0.15, l.start + 0.1), 1 - kit.prog(t, l.end + 0.15, l.end + 0.4)) });
