        ]);
        var c = kit.cursor(s.$("#book-cursor"), t, [
          { t: 0, x: 230, y: 300 }, { t: 0.35, x: 220, y: 300, tap: true }, { t: 1.0, x: 220, y: 440 },
          { t: 1.45, x: 136, y: 505, tap: true }, { t: 2.0, x: 150, y: 640 }, { t: 2.6, x: 196, y: 780, tap: true },
          { t: 3.4, x: 196, y: 700 }, { t: 4.0, x: 196, y: 780, tap: true }, { t: 4.8, x: 250, y: 650 },
        ]);
        kit.set(s.$("#book-cursor"), { opacity: 1 - kit.prog(t, 4.6, 5.0) });
        kit.set(s.$("#book-r1"), { scale: t < 0.6 ? 1 - 0.03 * c : 1 });
        var picked = t >= 1.5;
        s.$("#book-seat2").classList.toggle("pick", picked);
        s.$("#book-n2").setAttribute("fill", picked ? "#fff" : "#48506a");
        s.$("#book-picked").textContent = picked ? "1 o‘rin · 2-o‘rindiq" : "O‘rindiq tanlanmagan";
        kit.set(s.$("#book-next"), { scale: t > 2.4 && t < 2.9 ? 1 - 0.06 * c : 1, opacity: picked ? 1 : 0.45 });
        // paying: the button spins, then the ticket
        var paying = t >= 4.05 && t < 5.0;
        kit.set(s.$("#book-pay"), { scale: t > 3.8 && t < 4.3 ? 1 - 0.06 * c : 1 });
        s.$("#book-paylbl").style.display = paying ? "none" : "inline";
        kit.set(s.$("#book-spin"), { display: paying ? "block" : "none", rotate: t * 540 });
        var ring = s.$("#book-ring"), L = 2 * Math.PI * 34;
        ring.setAttribute("stroke-dasharray", L + " " + L);
        ring.setAttribute("stroke-dashoffset", String(L * (1 - kit.prog(t, 5.2, 5.8))));
        var tick = s.$("#book-tick");
        tick.setAttribute("stroke-dasharray", "50 50");
        tick.setAttribute("stroke-dashoffset", String(50 * (1 - kit.prog(t, 5.6, 6.0))));
        kit.set(s.$("#book-ticket"), { y: (1 - kit.prog(t, 5.6, 6.3, kit.ease.outBack)) * 120, opacity: kit.prog(t, 5.6, 5.9) });
        kit.reveal(s.$("#book-share"), t, 6.6);

        var spans = [[0, 2.8], [2.85, 4.95], [5.0, 99]];
        spans.forEach(function (sp, i) {
          var el = s.$("#book-cap" + i);
          el.style.visibility = t >= sp[0] && t < sp[1] + 0.3 ? "visible" : "hidden";
          kit.reveal(el, t, sp[0] + 0.05, { until: sp[1], outLen: 0.25 });
          kit.words(s.$("#book-t" + i), t, sp[0] + 0.12, { step: 0.08, accent: ["o‘zingiz", "Humo", "Uzcard", "QR-kod"] });
          for (var j = 0; j < 3; j++) s.$("#book-st" + i + j).classList.toggle("on", j <= i);
        });
        bookSub(s.$("#book-sub"), t, s, ["04"]);
      });

      function bookSub(el, t, s, ids) {
        var on = null;
        ids.forEach(function (id) {
          var l = s.line(id);
          if (t >= l.start - 0.15 && t < l.end + 0.4) on = id;
        });
        var span = el.firstElementChild;
        if (!on) return kit.set(el, { opacity: 0 });
        if (span.__id !== on) {
          span.textContent = kit.t("sub." + on);
          span.__id = on;
        }
        var l = s.line(on);
        kit.set(el, { opacity: Math.min(kit.prog(t, l.start - 0.15, l.start + 0.1), 1 - kit.prog(t, l.end + 0.15, l.end + 0.4)) });
      }

    </script>
  </div>
</template>
