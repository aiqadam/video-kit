          y: kit.interp(t, ts, keys.map(function (k) { return k.y || 0; }), e),
        });
      }

      window.__timelines["driver"] = kit.scene("driver", function (t, s) {
        kit.set(s.$("#driver-girih"), { y: -t * 8 });
        kit.reveal(s.$("#driver-kicker"), t, 0.1);
        kit.words(s.$("#driver-title"), t, 0.2, { step: 0.1, accent: ["o‘rindiqsiz"] });
        kit.set(s.$("#driver-phone"), { y: (1 - kit.prog(t, 0, 0.7)) * 140, opacity: kit.prog(t, 0, 0.3) });
        phoneCam(s.$("#driver-cam"), t, [{ t: 0, s: 0.92 }, { t: 0.8, s: 0.92 }, { t: 1.4, s: 1.12, y: 120 }, { t: 3.2, s: 1.12, y: 120 }, { t: 4.0, s: 1.04, y: -40 }, { t: 8, s: 1.06, y: -50 }]);
        var n = 2;
        [1.0, 2.0].forEach(function (a, i) {
          var b = s.$("#driver-b" + i);
          var inP = kit.prog(t, a, a + 0.4, kit.ease.outBack), outP = kit.prog(t, a + 0.85, a + 1.1, kit.ease.in);
          kit.set(b, { y: -110 * (1 - inP) - 120 * outP, opacity: Math.min(1, inP * 2) * (1 - outP), scale: 0.94 + 0.06 * inP });
          var seat = s.$("#driver-s" + (i + 3));
          var on = t >= a + 0.3;
          if (on) n++;
          seat.classList.toggle("full", on);
        });
        s.$("#driver-n").textContent = n + " / 4";
        s.$("#driver-sum").textContent = (n * 120).toString() + " 000 so‘m";
        kit.set(s.$("#driver-full"), { opacity: kit.prog(t, 3.0, 3.3), y: (1 - kit.prog(t, 3.0, 3.5, kit.ease.outBack)) * 20 });
        var c = kit.cursor(s.$("#driver-cursor"), t, [{ t: 3.6, x: 300, y: 700 }, { t: 4.6, x: 196, y: 600 }, { t: 5.0, x: 196, y: 600, tap: true }, { t: 6, x: 260, y: 700 }], { from: 3.6 });
        kit.set(s.$("#driver-go"), { scale: 1 - 0.06 * c, opacity: n === 4 ? 1 : 0.5 });
        s.$("#driver-golbl").textContent = t >= 5.1 ? "Yo‘ldasiz · 12:40 da yetib borasiz" : "Yo‘lga chiqish";
        driverSub(s.$("#driver-sub"), t, s, ["06"]);
      });

      function driverSub(el, t, s, ids) {
        var on = null;
        ids.forEach(function (id) {
          var l = s.line(id);
          if (t >= l.start - 0.15 && t < l.end + 0.4) on = id;
        });
        var span = el.firstElementChild;
        if (!on) return kit.set(el, { opacity: 0 });
        if (span.__id !== on) {
          span.textContent = kit.t("sub." + on);
          span.__id = on;
        }
        var l = s.line(on);
        kit.set(el, { opacity: Math.min(kit.prog(t, l.start - 0.15, l.start + 0.1), 1 - kit.prog(t, l.end + 0.15, l.end + 0.4)) });
      }

    </script>
