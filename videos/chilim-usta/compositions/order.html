    <script>
      window.__timelines["order"] = kit.scene("order", function (t, s) {
        var GREEN = "#2f8f6b", COBALT = "#2b5fb3";

        // entrance
        kit.reveal(s.$("#order-kicker"), t, 0.1);
        kit.words(s.$("#order-head"), t, 0.2, { step: 0.12, accent: ["chilim"] });
        kit.set(s.$("#order-phone"), { y: (1 - kit.prog(t, 0, 0.8)) * 60, opacity: kit.prog(t, 0, 0.5) });
        kit.pop(s.$("#order-art"), t, 0.4, { base: 0.94 });

        // the finger: swatch, chip, field, button (taps match the "tap" sounds in video.json)
        var press = kit.cursor(s.$("#order-finger"), t, [
          { t: 1.2, x: 300, y: 760 },
          { t: 1.9, x: 184, y: 258, tap: true },
          { t: 3.3, x: 120, y: 417, tap: true },
          { t: 4.3, x: 240, y: 575, tap: true },
          { t: 6.0, x: 300, y: 700 },
          { t: 6.6, x: 236, y: 864, tap: true },
          { t: 7.4, x: 330, y: 760 },
        ], { from: 1.0 });

        // colour: green → cobalt on the 1.9 s tap
        var c = kit.prog(t, 1.9, 2.3);
        s.$("#order-body").setAttribute("fill", kit.color(GREEN, COBALT, c));
        kit.set(s.$("#order-ring"), { x: 110 * kit.prog(t, 1.9, 2.15) });

        // pattern: plain → atlas on the 3.3 s tap
        var a = kit.prog(t, 3.3, 3.7);
        s.$("#order-atlas").setAttribute("opacity", String(0.9 * a));
        var on = t >= 3.3;
        kit.set(s.$("#order-chip-atlas"), { background: on ? "#1d1712" : "transparent", color: on ? "#f6f1e8" : "#1d1712", borderColor: on ? "#1d1712" : "#d6cbbb" });
        kit.set(s.$("#order-chip-plain"), { background: on ? "transparent" : "#1d1712", color: on ? "#1d1712" : "#f6f1e8", borderColor: on ? "#d6cbbb" : "#1d1712" });

        // engraving typed after the 4.3 s tap, one key a 0.2 s (the "key" sounds)
        kit.type(s.$("#order-typed"), t, 4.55, { cps: 5 });
        s.$("#order-engrave").textContent = s.$("#order-typed").textContent;
        var focused = t >= 4.3 && t < 6.6;
        kit.set(s.$("#order-caret"), { opacity: focused && Math.floor(t * 2.5) % 2 === 0 ? 1 : 0 });
        kit.set(s.$("#order-field"), { borderColor: focused ? "#1d1712" : "#d6cbbb" });

        // order: button press, then the confirmation screen
        kit.set(s.$("#order-btn"), { scale: 1 - 0.05 * (t > 6 && t < 7 ? press : 0) });
        kit.set(s.$("#order-done"), { opacity: kit.prog(t, 6.75, 7.05) });
        kit.set(s.$("#order-form"), { visibility: t < 7.05 ? "visible" : "hidden" });
        kit.pop(s.$("#order-check"), t, 6.85);
        kit.reveal(s.$("#order-done-1"), t, 7.0);
        kit.reveal(s.$("#order-done-2"), t, 7.25);
