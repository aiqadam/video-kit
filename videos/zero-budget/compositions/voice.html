    <script>
      window.__timelines["voice"] = kit.scene("voice", function (t, s) {
        kit.reveal(s.$("#voice-eyebrow"), t, 0, { y: 10, len: 0.3 });
        kit.reveal(s.$("#voice-term"), t, 0.2, { y: 24, len: 0.4 });
        kit.reveal(s.$("#voice-file"), t, 1.8, { y: 10, len: 0.4 });
        // a slow push-in so the tail of the scene keeps breathing
        kit.set(s.$("#voice-term"), { scale: 1 + 0.02 * kit.prog(t, 2.8, 5.8, kit.ease.linear) });
        // a deterministic waveform: the take being spoken over
        var bars = s.$("#voice-wave").children;
        var spoken = s.line("04");
        var p = spoken ? (t - spoken.start) / Math.max(0.001, spoken.end - spoken.start) : 0;
        p = Math.max(0, Math.min(1, p));
        for (var i = 0; i < bars.length; i++) {
          var x = i / bars.length;
          // a fixed shape that lights up left to right as the line is spoken
          var shape = 0.35 + 0.65 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.6));
          var played = x <= p ? 1 : 0.22;
          kit.set(bars[i], { height: Math.round(14 + shape * 92) * played, opacity: x <= p ? 0.9 : 0.3 });
        }
      });
