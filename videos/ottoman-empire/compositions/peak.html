<template>
  <div id="root" data-composition-id="peak">
    <style>
      #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
      .peak-pic { position: absolute; inset: 0; overflow: hidden; }
      .peak-pic img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      #peak-shade { position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(13,10,8,.94) 0px, rgba(13,10,8,.75) 300px, rgba(13,10,8,0) 560px),
                    linear-gradient(0deg, rgba(13,10,8,.97) 0px, rgba(13,10,8,.9) 560px, rgba(13,10,8,0) 1080px); }
      .peak-label { position: absolute; left: 80px; max-width: 920px; top: 300px; font-size: 30px; line-height: 1.3;
        color: var(--ink); font-style: italic; visibility: hidden; padding: 6px 14px; margin-left: -14px;
        background: rgba(13,10,8,.72); border-radius: 8px; }
      #peak-tl { position: absolute; left: 80px; right: 80px; top: 170px; height: 80px; }
      #peak-tl .line { position: absolute; left: 0; right: 0; top: 18px; height: 4px; background: rgba(245,236,220,.28); border-radius: 2px; }
      #peak-tl .fill { position: absolute; left: 0; top: 18px; height: 4px; background: var(--accent); border-radius: 2px; }
      #peak-tl .dot { position: absolute; top: 8px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 0 6px rgba(212,162,76,.25); }
      #peak-tl .a, #peak-tl .b { position: absolute; top: 40px; font-size: 30px; font-weight: 600; color: var(--muted); }
      #peak-tl .b { right: 0; }
      .peak-beat { position: absolute; left: 80px; width: 880px; bottom: 340px; visibility: hidden; }
      .peak-year { font-family: var(--display); font-weight: 800; font-size: 190px; line-height: 1; color: var(--accent);

      #peak-p0 { background: var(--bg); }

      #peak-area { position: absolute; left: 80px; top: 1460px; font-size: 40px; font-weight: 600; color: var(--muted); visibility: hidden; }    </style>
    <div class="peak-pic" id="peak-p0"><img id="peak-i0" src="assets/fetched/images/ottoman-empire-map-1683-orthographic-pro.jpg" alt=""></div>
    <div id="peak-shade"></div>
    <div class="peak-label" id="peak-l0">Империя в 1683 году. Карта: Muhammad782, CC0</div>

    <div class="peak-beat" id="peak-b0"><div class="peak-year" id="peak-y0">1683</div><div class="peak-cap" id="peak-c0">Европа, Азия, Африка: наибольшая площадь, около 5,2 млн км²</div></div>
    <script>
      window.__timelines["peak"] = kit.scene("peak", function (t, s) {
        var ID = "peak", TL = [1566, 1683];
        var PICS = [{"frm": 0, "to": null, "x": [80.0, 0.0], "y": [360, 360], "s": [0.71875, 0.796875]}];
        var BEATS = [{"at": 0, "year": "1683", "num": [1566, 1683]}];
        var BAR = 1.92, Y0 = 1299, Y1 = 1922, TLW = 920;
        // timeline: the marker slides from the previous period to this one on the first beat
        var yr = kit.interp(t, [0, 0.8], [TL[0], TL[1]], kit.ease.inOut);
        var px = (yr - Y0) / (Y1 - Y0) * TLW;
        kit.set(s.$("#" + ID + "-dot"), { left: px + "px" });
        kit.set(s.$("#" + ID + "-fill"), { width: px + "px" });
        PICS.forEach(function (p, i) {
          var el = s.$("#" + ID + "-p" + i), img = s.$("#" + ID + "-i" + i), lab = s.$("#" + ID + "-l" + i);
          var to = p.to === null ? s.dur : p.to;
          var on = t >= p.frm && t < to;
          var o = p.frm === 0 ? 1 : kit.prog(t, p.frm, p.frm + 0.35, kit.ease.linear);
          kit.set(el, { visibility: on ? "visible" : "hidden", opacity: o });
          var k = kit.prog(t, p.frm, to, kit.ease.linear);
          kit.set(img, { x: kit.interp(k, [0, 1], p.x), y: kit.interp(k, [0, 1], p.y), scale: kit.interp(k, [0, 1], p.s) });
          kit.set(lab, { visibility: on ? "visible" : "hidden" });
          kit.reveal(lab, t, p.frm + 0.3, { y: 10 });
        });
        BEATS.forEach(function (b, i) {
          var next = i + 1 < BEATS.length ? BEATS[i + 1].at : 1e9;
          var el = s.$("#" + ID + "-b" + i), y = s.$("#" + ID + "-y" + i);
          var on = t >= b.at && t < next;
          kit.set(el, { visibility: on ? "visible" : "hidden" });
          if (b.num) {
            var v = kit.interp(t, [b.at, b.at + 0.7], b.num, kit.ease.out);
            y.textContent = String(Math.round(v)) + b.year.slice(4);
          }
          kit.reveal(y, t, b.at, { y: 30, len: 0.4 });
          kit.words(s.$("#" + ID + "-c" + i), t, b.at + 0.25, { step: 0.07, len: 0.4 });
        });

      });
    </script>
