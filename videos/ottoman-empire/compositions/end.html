    <script>

        var ID = "end", TL = [1918, 1922];
        var PICS = [{"frm": 0, "to": null, "x": [-111.80790273556238, -175.71063829787238], "y": [-16.128000000000043, -96.76800000000003], "s": [0.595258358662614, 0.6536170212765958]}];

        var yr = kit.interp(t, [0, 0.8], [TL[0], TL[1]], kit.ease.inOut);
        var px = (yr - Y0) / (Y1 - Y0) * TLW;
        kit.set(s.$("#" + ID + "-dot"), { left: px + "px" });
        kit.set(s.$("#" + ID + "-fill"), { width: px + "px" });

          var o = p.frm === 0 ? 1 : kit.prog(t, p.frm, p.frm + 0.35, kit.ease.linear);
          kit.set(el, { visibility: on ? "visible" : "hidden", opacity: o });
          var k = kit.prog(t, p.frm, to, kit.ease.linear);

          kit.reveal(lab, t, p.frm + 0.3, { y: 10 });

        BEATS.forEach(function (b, i) {
          var next = i + 1 < BEATS.length ? BEATS[i + 1].at : 1e9;
          var el = s.$("#" + ID + "-b" + i), y = s.$("#" + ID + "-y" + i);
          var on = t >= b.at && t < next;
          kit.set(el, { visibility: on ? "visible" : "hidden" });
          if (b.num) {
            var v = kit.interp(t, [b.at, b.at + 0.7], b.num, kit.ease.out);
            y.textContent = String(Math.round(v)) + b.year.slice(4);
          }
          kit.reveal(y, t, b.at, { y: 30, len: 0.4 });
          kit.words(s.$("#" + ID + "-c" + i), t, b.at + 0.25, { step: 0.07, len: 0.4 });

        kit.set(s.$("#end-p0"), { opacity: 1 - 0.7 * kit.prog(t, FIN, FIN + 0.5) });
