  <span class="timeline-k">"dur"</span>: 5.76,
  <span class="timeline-k">"lines"</span>: [
    { <span class="timeline-k">"id"</span>: "04", <span class="timeline-k">"at"</span>: 0.2,
      <span class="timeline-k">"text"</span>:<span id="timeline-said">"This very sentence is a line in the timeline. You're hearing it now."</span>    }
  ]
}</div>
      <div id="timeline-ruler">
        <div id="timeline-track"></div>
        <div id="timeline-block"></div>
        <div id="timeline-head"></div>
      </div>
    </div>
    <script>
      window.__timelines["timeline"] = kit.scene("timeline", function (t, s) {
        var bars = s.$("#timeline-steps").querySelectorAll("i");
        for (var b = 0; b < bars.length; b++) bars[b].className = b < 1 ? "done" : b === 1 ? "on" : "";

        kit.reveal(s.$("#timeline-cap"), t, 0, { y: 24, len: 0.4 });
        kit.reveal(s.$("#timeline-panel"), t, 0.05, { y: 40, len: 0.45 });

        // each word of the line lights up as the voice says it: word timings when the
        // provider gives them, otherwise spread over the line by length
        var line = s.line("04");
        var spans = s.$("#timeline-said").__words;
        if (!spans) {
          var el = s.$("#timeline-said");
          var ws = el.textContent.trim().split(/\s+/);
          el.textContent = "";
          spans = ws.map(function (w, i) {
            var sp = document.createElement("span");
            sp.textContent = w;
            el.appendChild(sp);
            if (i < ws.length - 1) el.appendChild(document.createTextNode(" "));
            return sp;
          });
          el.__words = spans;
        }
        var total = 0, starts = [];
        spans.forEach(function (sp) { starts.push(total); total += sp.textContent.length + 1; });
        spans.forEach(function (sp, i) {
          var at = line.words && line.words[i] ? line.words[i].start : line.start + (line.end - line.start) * (starts[i] / total);
          var p = kit.prog(t, at, at + 0.12);
          sp.style.color = kit.color("#5e6365", "#fdfaf5", p);
        });

        // the ruler: the line's block on the scene clock, and the playhead
        var w = 980;
        kit.set(s.$("#timeline-block"), { left: (line.start / s.dur) * w + "px", width: ((line.end - line.start) / s.dur) * w + "px" });
        kit.set(s.$("#timeline-head"), { left: (t / s.dur) * w + "px" });
      });
    </script>
