    <script>
      window.__timelines["media"] = kit.scene("media", function (t, s) {
        var BAR = 1.92;
        var bars = s.$("#media-steps").querySelectorAll("i");
        for (var b = 0; b < bars.length; b++) bars[b].className = b < 2 ? "done" : b === 2 ? "on" : "";

        // bar 1: the finished shot; bar 2: an x-ray edge wipes it off the left 60%
        kit.set(s.$("#media-shot"), { scale: kit.interp(t, [0, s.dur], [1.04, 1.0]) });
        kit.words(s.$("#media-ex"), t, 0.15, { step: 0.08, len: 0.35 });
        var wipe = kit.prog(t, BAR, BAR + 0.9, kit.ease.inOut);
        var x = 1180 * wipe;
        s.$("#media-shot").style.clipPath = "inset(0 0 0 " + x + "px)";
        kit.set(s.$("#media-edge"), { left: x + "px", opacity: wipe > 0 && wipe < 1 ? 1 : wipe >= 1 ? 0.6 : 0 });
        kit.set(s.$("#media-ex"), { opacity: 1 - kit.prog(t, BAR, BAR + 0.5) });
        kit.set(s.$("#media-where"), { opacity: 1 - kit.prog(t, BAR, BAR + 0.3) });
        kit.set(s.$("#media-eyebrow"), { opacity: kit.prog(t, BAR + 0.3, BAR + 0.7) });

        kit.reveal(s.$("#media-cap"), t, BAR + 0.35, { y: 20, len: 0.4 });
        kit.reveal(s.$("#media-code"), t, BAR + 0.5, { y: 20, len: 0.4 });
        // the author and the license light up as the voice names them
        [["#media-author", s.word("05", "author")], ["#media-license", s.word("05", "license")]].forEach(function (h) {
          var at = Math.max(h[1], BAR + 1.0);
          var p = kit.prog(t, at, at + 0.25);
          s.$(h[0]).style.background = "rgba(60, 162, 158, " + 0.28 * p + ")";
          s.$(h[0]).style.color = kit.color("#9fa3a4", "#fdfaf5", p);
        });
      });
