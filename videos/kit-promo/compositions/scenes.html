    <script>
      window.__timelines["scenes"] =
        kit.scene("scenes", function (t, s) {
          var LOOK = 2.88;
          var look = t >= LOOK;
          var bars = s.$("#scenes-steps").querySelectorAll("i");
          var n = look ? 5 : 4;
          for (var b = 0; b < bars.length; b++) bars[b].className = b < n - 1 ? "done" : b === n - 1 ? "on" : "";
          s.$("#scenes-n").textContent = "0" + n;

          // step 04: the scene's own code; step 05: the frames it renders, looked at one by one
          kit.reveal(s.$("#scenes-cap4"), t, 0, { y: 24, len: 0.4, until: LOOK - 0.25 });
          kit.set(s.$("#scenes-cap4"), { visibility: look ? "hidden" : "visible" });
          kit.reveal(s.$("#scenes-cap5"), t, LOOK, { y: 24, len: 0.4 });
          kit.set(s.$("#scenes-cap5"), { visibility: look ? "visible" : "hidden" });
          kit.reveal(s.$("#scenes-panel"), t, 0.05, { y: 40, len: 0.45 });
          kit.reveal(s.$("#scenes-code"), t, 0.05, { y: 0, len: 0.3, until: LOOK - 0.2 });
          kit.set(s.$("#scenes-code"), { visibility: look ? "hidden" : "visible" });
          kit.set(s.$("#scenes-file4"), { opacity: 1 - kit.prog(t, LOOK - 0.2, LOOK) });

          kit.reveal(s.$("#scenes-sheet"), t, LOOK);
          var frames = s.$("#scenes-sheet").children;
          for (var i = 0; i < frames.length; i++) {
            var at = LOOK + 0.1 + i * 0.07;
            kit.set(frames[i], { opacity: kit.prog(t, at, at + 0.2), scale: 0.92 + 0.08 * kit.prog(t, at, at + 0.3) });
            // the look: a light passes over each frame and leaves a tick behind
            var seen = LOOK + 0.9 + i * 0.16;
            var on = kit.prog(t, seen, seen + 0.08) * (1 - kit.prog(t, seen + 0.16, seen + 0.3));
            frames[i].style.outlineColor = "rgba(60, 162, 158, " + on + ")";
            kit.pop(frames[i].querySelector(".scenes-tick"), t, seen + 0.12, { base: 0.5 });
          }
        });
