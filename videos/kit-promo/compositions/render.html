    </style>
    <div class="kp-eyebrow" id="render-eyebrow">AI Qadam · Video Kit</div>
    <div class="kp-steps" id="render-steps">
      <div class="kp-bars"><i style="height: 12px"></i><i style="height: 18px"></i><i style="height: 24px"></i><i style="height: 30px"></i><i style="height: 36px"></i><i style="height: 42px"></i><i style="height: 48px"></i></div>
      <div class="kp-label">Step <b>07</b> / 07</div>
    </div>
    <div class="kp-cap" id="render-cap">
      <div class="kp-num">07</div>
      <div class="kp-word">Render</div>
      <div class="kp-sub">mixed to a steady loudness</div>
    </div>
    <div class="kp-panel" id="render-panel">
      <div class="kp-file">terminal</div>
      <div id="render-run"><span class="render-gt">›</span> <span id="render-cmd">node kit.mjs render kit-promo</span></div>
      <div id="render-track"><div id="render-fill"></div></div>
      <div id="render-pct">0%</div>
      <div id="render-lufs">−16 <small>LUFS integrated</small></div>
    </div>
    <div id="render-player">
      <img src="assets/frames/first.jpg" alt="" />
      <div id="render-play"><div id="render-tri"></div><div id="render-bar"></div><span>kit-promo-en.mp4</span></div>
    </div>
    <div id="render-under">the video you are watching</div>
    <script>
      window.__timelines["render"] = kit.scene("render", function (t, s) {
        var BACK = 2.4;
        var bars = s.$("#render-steps").querySelectorAll("i");
        for (var b = 0; b < bars.length; b++) bars[b].className = b < 6 ? "done" : "on";

        // the render runs, the mix lands at its loudness
        kit.reveal(s.$("#render-cap"), t, 0, { y: 24, len: 0.4 });
        kit.reveal(s.$("#render-panel"), t, 0.05, { y: 40, len: 0.45 });
        var done = kit.prog(t, 0.3, 1.3, kit.ease.inOut);
        s.$("#render-fill").style.width = done * 100 + "%";
        s.$("#render-pct").textContent = Math.round(done * 100) + "%";
        kit.pop(s.$("#render-lufs"), t, 1.35, { base: 0.9 });

        // on the beat: the first frame of this very video fills the screen, then pulls
        // back into a player
        var on = t >= BACK;
        var back = kit.prog(t, BACK + 0.15, BACK + 0.9, kit.ease.inOut);
        kit.set(s.$("#render-player"), {
          visibility: on ? "visible" : "hidden",
          scale: 1 - 0.36 * back,
          borderRadius: 24 * back + "px",
          boxShadow: "0 0 0 " + 4 * back + "px rgba(60, 162, 158, " + back + ")",
        });
        kit.set(s.$("#render-play"), { opacity: back });
        kit.reveal(s.$("#render-under"), t, BACK + 0.5, { y: 12, len: 0.35 });
        s.$("#render-under").style.visibility = on ? "visible" : "hidden";
        ["#render-eyebrow", "#render-steps", "#render-cap", "#render-panel"].forEach(function (id) {
          s.$(id).style.visibility = on ? "hidden" : "visible";
        });
      });
    </script>
