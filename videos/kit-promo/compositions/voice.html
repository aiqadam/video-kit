    <script>
      window.__timelines["voice"] = kit.scene("voice", function (t, s) {
        var bars = s.$("#voice-steps").querySelectorAll("i");
        for (var b = 0; b < bars.length; b++) bars[b].className = b < 5 ? "done" : b === 5 ? "on" : "";

        kit.reveal(s.$("#voice-cap"), t, 0, { y: 24, len: 0.4 });
        kit.reveal(s.$("#voice-panel"), t, 0.05, { y: 40, len: 0.45 });

        // the waveform of the line being spoken; the part already said turns teal
        var wave = s.$("#voice-wave");
        var peaks = (wave.getAttribute("data-peaks") || "").split(",").map(Number).filter(function (v) { return v > 0; });
        if (!peaks.length) for (var q = 0; q < 64; q++) peaks.push(0.25 + 0.75 * Math.abs(Math.sin(q * 0.9) * Math.cos(q * 0.37)));
        if (!wave.children.length) peaks.forEach(function () { wave.appendChild(document.createElement("i")); });
        var line = s.line("07");
        var said = (t - line.start) / (line.end - line.start);
        for (var k = 0; k < wave.children.length; k++) {
          var grow = kit.prog(t, 0.1 + k * 0.006, 0.4 + k * 0.006);
          wave.children[k].style.height = Math.max(4, 220 * peaks[k] * grow) + "px";
          wave.children[k].style.background = k / wave.children.length < said ? "#3ca29e" : "#3a4244";
        }

        // what the take was heard to say arrives under it; the match lands as it ends
        kit.reveal(s.$("#voice-heard"), t, 0.6, { y: 12, len: 0.35 });
        kit.pop(s.$("#voice-match"), t, Math.min(line.end, s.dur - 1.5), { base: 0.85 });
      });
    </script>
